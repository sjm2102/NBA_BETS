<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA Bets - Today's Best Picks</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1020">

  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NBA Bets">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>

<body>
  <div class="container">
    <header class="topbar">
      <div>
        <h1>NBA Bets – Today’s Best Picks</h1>
        <div class="subtle" id="updatedAt">Updated: —</div>
      </div>
      <button id="refreshBtn" class="btn">Refresh</button>
    </header>

    <section class="cards">
      <div class="card">
        <div class="cardTitle">Moneyline Hit Rate</div>
        <div class="cardValue" id="mlHitRate">—</div>
      </div>
      <div class="card">
        <div class="cardTitle">Spread Hit Rate</div>
        <div class="cardValue" id="spreadHitRate">—</div>
      </div>
    </section>

    <!-- BEST PICKS -->
    <section class="panel">
      <div class="panelHeader">
        <h2 id="bestPicksTitle">Todays Best Picks</h2>
        <div class="panelControls">
          <label class="subtle" for="riskFilter">Risk Profile</label>
          <select id="riskFilter">
            <option value="all" selected>Show all</option>
            <option value="safe">Safe (>= 1.0u)</option>
            <option value="high">High Confidence</option>
          </select>
        </div>
      </div>

      <div class="tableWrap">
        <table id="betsTable">
          <thead>
            <tr>
              <th>Bet Type</th>
              <th>Bet</th>
              <th>Probability</th>
              <th>Opponent</th>
              <th>Confidence</th>
              <th>Units</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="subtle" id="statusLine"></div>
    </section>

    <!-- DVP -->
    <section class="panel" style="margin-top:18px;">
      <div class="panelHeader">
        <h2>DvP (Defense vs Position)</h2>
        <div class="panelControls">
          <label class="subtle" for="dvpTeam">Team</label>
          <select id="dvpTeam"></select>

          <label class="subtle" for="dvpPosition">Position</label>
          <select id="dvpPosition"></select>

          <label class="subtle" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="dvpCompact" />
            Compact view
          </label>
        </div>
      </div>

      <div class="tableWrap">
        <table id="dvpTable">
          <thead id="dvpThead"></thead>
          <tbody id="dvpTbody"></tbody>
        </table>
      </div>

      <div class="subtle" id="dvpStatusLine"></div>
    </section>

    <footer class="footer" style="margin-top:22px;">
      <p>Probabilities are estimates based on your model + data. No guarantees—use responsibly.</p>
    </footer>
  </div>

  <script src="./script.js"></script>
</body>
</html>
